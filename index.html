<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Equinox Privacy Policy</title>
    
    <!-- Canonical URL pointing to the new location -->
    <link rel="canonical" href="https://crawik.com/equinox/privacy">
    
    <!-- Prevent search engine indexing -->
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Meta refresh redirect (0 second delay) -->
    <meta http-equiv="refresh" content="0; url=https://crawik.com/equinox/privacy">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 600px;
            margin: 100px auto;
            padding: 20px;
            text-align: center;
            color: #333;
        }
        a {
            color: #007AFF;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .redirect-message {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="redirect-message">
        <h1>Privacy Policy has moved</h1>
        <p>You are being redirected to the new location.</p>
        <p>If you are not redirected automatically, please click the link below:</p>
        <p><a href="https://crawik.com/equinox/privacy">https://crawik.com/equinox/privacy</a></p>
    </div>
</body>
</html>
